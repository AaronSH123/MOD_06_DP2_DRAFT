server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: areas-verdes-mod05
  datasource:
    url: ${MOD05_DB_URL:jdbc:postgresql://localhost:5432/areas_verdes_mod05}
    username: ${MOD05_DB_USER:areas_verdes}
    password: ${MOD05_DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: ${MOD05_MAX_FILE_SIZE:20MB}
      max-request-size: ${MOD05_MAX_REQUEST_SIZE:100MB}
springdoc:
  api-docs:
    path: /api/tercerizados/schema
  swagger-ui:
    path: /api/tercerizados/docs
mod05:
  archivos: ${MOD05_ARCHIVOS_DIR:./private-media}
  max-archivo-bytes: ${MOD05_MAX_ARCHIVO_BYTES:20971520}
  mock-data: ${MOD05_MOCK_DATA:../mock-data}
